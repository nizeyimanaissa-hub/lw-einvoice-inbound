name: ci
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests (official KoSIT Schematron with Saxon, then the Groovy scripts)
        run: ./test/unit/run.sh
      - name: CPI resource bundle builds (flattened XSDs, XSLTs)
        run: python3 scripts/build-cpi-resources.py
